<!DOCTYPE html><html lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>MVP Poster — ECA LOC 1</title>
<!-- Tailwind CSS v3 with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Montserrat & Anton for impactful sports graphics -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Montserrat:ital,wght@0,600;0,700;0,800;0,900;1,900&amp;display=swap" rel="stylesheet">
<style data-purpose="custom-typography">
  .font-impact-stat {
    font-family: 'Anton', -apple-system, BlinkMacSystemFont, sans-serif;
    letter-spacing: -0.02em;
    line-height: 0.9;
  }
  .font-sports-title {
    font-family: 'Montserrat', sans-serif;
  }
</style>
<style data-purpose="visual-effects">
  /* Deep sports lighting gradient */
  .sports-gradient-bg {
    background: radial-gradient(circle at 50% 28%, #133b7b 0%, #09204a 45%, #040c1d 85%);
  }
  /* Player image frame — the same geometry loc2-mvp.html uses. Both posters
     render 844px tall, so these are shared pixel offsets rather than
     percentages; percentages of differing canvases would not in fact match. */
  .player-image-layer {
    top: 118px;
    bottom: 60px;
  }
  .player-img {
    max-height: 100%;
    width: auto;
    object-fit: contain;
    transform: scale(1.32);
    transform-origin: center top;
  }
  .stat-glow {
    text-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 2px 8px rgba(0, 0, 0, 0.5);
  }
</style>
</head>
<body class="bg-black text-white flex justify-center items-center min-h-screen selection:bg-amber-500 selection:text-black font-sports-title">
<!-- ECA LOC 1 (McCarthy Shield). Coloured-kit side, so this follows the dark
     treatment of grade4-mvp.html rather than the white-kit loc2-mvp.html.
     Only the association badge and the competition default differ. -->
<!-- BEGIN: PosterContainer -->
<!-- Mobile canvas, 412px max width, 100vh or standard phone height, zero overflow, layered properly -->
<main data-capture class="relative w-full max-w-[675px] h-[843.75px] max-h-screen sports-gradient-bg overflow-hidden flex flex-col justify-between shadow-2xl border border-white/5" style="background: linear-gradient(180deg, #020712 0%, #06152e 32%, #0a254c 54%, #071933 80%, #031015 100%);">

<div class="shard-2" style="position: absolute; right: -18px; top: 62%; width: 48px; height: 140px; background: linear-gradient(135deg, rgb(236, 72, 153) 0%, rgb(219, 39, 119) 50%, rgb(190, 24, 93) 100%); transform: skewY(-22deg) rotate(-10deg); box-shadow: rgba(219, 39, 119, 0.4) 0px 10px 25px; z-index: 2; border-radius: 4px;"></div>
</div>
<!-- Subtle vignette & background glow -->
<div class="absolute inset-0 pointer-events-none z-0 overflow-hidden"><div class="absolute -top-10 left-1/2 -translate-x-1/2 w-[340px] h-[480px] rounded-full opacity-60 blur-3xl" style="background: radial-gradient(ellipse at 50% 45%, rgba(56, 189, 248, 0.35) 0%, rgba(30, 58, 138, 0.2) 50%, transparent 75%);"></div><div class="absolute top-0 left-[-40px] w-48 h-[650px] opacity-25 -rotate-[22deg] origin-top-left pointer-events-none" style="background: linear-gradient(180deg, rgba(255, 255, 255, 0.5) 0%, rgba(56, 189, 248, 0.25) 35%, transparent 80%); filter: blur(16px);"></div><div class="absolute top-0 right-[-40px] w-48 h-[650px] opacity-25 rotate-[22deg] origin-top-right pointer-events-none" style="background: linear-gradient(180deg, rgba(255, 255, 255, 0.5) 0%, rgba(56, 189, 248, 0.25) 35%, transparent 80%); filter: blur(16px);"></div><div class="absolute bottom-0 inset-x-0 h-40 pointer-events-none" style="background: radial-gradient(ellipse at 50% 120%, rgba(16, 85, 52, 0.22) 0%, transparent 70%);"></div></div>

<!-- 5. DEDICATED SPONSORS FOOTER (All 5 club sponsors neatly structured, zero overlap) -->
